    <canvas id="scene"></canvas>

    <div id="veil" aria-hidden="true"><div class="veil-mark">Yarn Edit</div></div>

      <div class="preview-card">
        <button class="preview-close" data-close aria-label="Close preview">×</button>
        <div class="preview-media">
          <img id="pvImg" alt="" />
          <div id="pvThumbs" class="preview-thumbs"></div>
        </div>
        <div class="preview-info">
          <h3 id="pvName"></h3>
          <p id="pvPrice" class="preview-price"></p>

          <a id="pvOrder" class="preview-order" href="https://www.instagram.com/the.yarn.edit_/" target="_blank" rel="noopener">Order on Instagram</a>
